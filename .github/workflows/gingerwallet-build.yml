name: GingerWallet Reproducible Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'GingerWallet version (without leading v, e.g. 2.0.23)'
        required: true
        type: string
      commit:
        description: 'Optional git commit to build (overrides tag checkout)'
        required: false
        type: string
      sdk_version:
        description: '.NET SDK version (default 8.0.100)'
        required: false
        type: string
        default: '8.0.100'
      runtime_version:
        description: '.NET runtime version (default 8.0.21)'
        required: false
        type: string
        default: '8.0.21'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout GingerWallet
        uses: actions/checkout@v4
        with:
          repository: GingerPrivacy/GingerWallet
          ref: ${{ inputs.commit || format('v{0}', inputs.version) }}
          fetch-depth: 1

      - name: Install exact .NET SDK version
        run: |
          Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Version ${{ inputs.sdk_version }} -InstallDir "$env:LOCALAPPDATA\dotnet-exact"
          ./dotnet-install.ps1 -Runtime dotnet -Version ${{ inputs.runtime_version }} -InstallDir "$env:LOCALAPPDATA\dotnet-exact"
          echo "$env:LOCALAPPDATA\dotnet-exact" | Out-File -FilePath $env:GITHUB_PATH -Append
          echo "DOTNET_ROOT=$env:LOCALAPPDATA\dotnet-exact" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "DOTNET_MULTILEVEL_LOOKUP=0" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "DOTNET_ROLL_FORWARD=LatestPatch" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: Verify SDK version
        run: dotnet --version

      - name: Clear NuGet cache
        run: dotnet nuget locals all --clear

      - name: Force-evaluate restore (Fluent)
        run: dotnet restore WalletWasabi.Fluent/WalletWasabi.Fluent.csproj -p:RestoreLockedMode=false -p:RestorePackagesWithLockFile=true --force-evaluate

      - name: Force-evaluate restore (Fluent.Desktop)
        run: dotnet restore WalletWasabi.Fluent.Desktop/WalletWasabi.Fluent.Desktop.csproj -p:RestoreLockedMode=false -p:RestorePackagesWithLockFile=true --force-evaluate

      - name: Patch Packager (skip git check only)
        run: |
          $content = Get-Content WalletWasabi.Packager\Program.cs -Raw
          $content = $content -replace 'private static void CheckUncommittedGitChanges\(\)','private static void CheckUncommittedGitChanges() { return; } private static void _OrigCheckUncommittedGitChanges()'
          $content | Set-Content WalletWasabi.Packager\Program.cs
        shell: pwsh

      - name: Build Packager
        run: dotnet build WalletWasabi.Packager/WalletWasabi.Packager.csproj -c Release

      - name: Run Packager (onlybinaries)
        working-directory: WalletWasabi.Packager
        run: dotnet run -- --onlybinaries

      - name: Upload linux-x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: gingerwallet-${{ inputs.version }}-linux-x64
          path: WalletWasabi.Fluent.Desktop/bin/dist/linux-x64/
          if-no-files-found: error
